name: Reusable - Build & Push por ambiente

# "workflow_call" es lo que hace que este archivo sea "reusable": no se dispara
# solo, solo lo puede invocar OTRO workflow (los deploy-dev/qa/prod.yml) pasandole
# estos inputs. Es la logica de build+push escrita UNA sola vez.
on:
  workflow_call:
    inputs:
      environment:
        description: 'Nombre del Environment de GitHub (dev, qa, prod)'
        required: true
        type: string
      image-tag:
        description: 'Tag corto para las imagenes de este ambiente (dev, qa, prod)'
        required: true
        type: string

jobs:
  build-push:
    runs-on: ubuntu-latest
    # Este "environment:" es lo que conecta el job con las variables/secrets y las
    # reglas de proteccion que configures en Settings -> Environments para cada
    # ambiente (por ej. VITE_API_URL, o pedir aprobacion manual antes de "prod").
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # Docker exige que el nombre del repositorio en el tag sea todo en
      # minusculas, y GitHub Actions no tiene una funcion "toLower()" para
      # expresiones -- por eso lo calculamos con el propio shell (bash) y lo
      # guardamos como variable de entorno para el resto de los steps.
      - name: Nombre del repo en minusculas (Docker lo exige)
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login a GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/api:${{ inputs.image-tag }}
            ghcr.io/${{ env.REPO }}/api:${{ inputs.image-tag }}-${{ github.sha }}

      - name: Build & push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          # VITE_API_URL viene del Environment (inputs.environment), no esta
          # hardcodeado aca -- mismo principio que ConfigService en el backend:
          # el pipeline no sabe ni le importa cual es el valor real de cada ambiente.
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ghcr.io/${{ env.REPO }}/web:${{ inputs.image-tag }}
            ghcr.io/${{ env.REPO }}/web:${{ inputs.image-tag }}-${{ github.sha }}

      # TODO: cuando el servidor (VM de Oracle) este listo, agregar aca un step
      # que se conecte por SSH y corra `docker compose pull && docker compose up -d`
      # para que ese ambiente pase a correr las imagenes que se acaban de publicar.
